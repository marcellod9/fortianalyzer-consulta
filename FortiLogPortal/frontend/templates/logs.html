{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block heading %}<i class="bi bi-list-ul"></i> Consulta de logs (FortiAnalyzer){% endblock %}
{% block content %}
<form id="form" class="card card-body mb-3" autocomplete="off">
  <div class="row g-2">
    <div class="col-md-3"><label class="form-label small">Usuário (login)</label>
      <input class="form-control form-control-sm" name="user" placeholder="ex.: marcello.sousa"></div>
    <div class="col-md-3"><label class="form-label small">IP do computador</label>
      <input class="form-control form-control-sm" name="srcip" placeholder="ex.: 10.213.10.66"></div>
    <div class="col-md-3"><label class="form-label small">Site acessado</label>
      <input class="form-control form-control-sm" name="hostname" placeholder="ex.: www.exemplo.com.br"></div>
    <div class="col-md-3"><label class="form-label small">Tipo de log</label>
      <select class="form-select form-select-sm" name="logtype">{% for k, v in logtypes.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
    {% include "_period.html" %}
    <div class="col-md-auto d-flex align-items-end"><div class="form-check mb-1"><input class="form-check-input" type="checkbox" name="only_blocked" id="ob"><label class="form-check-label small" for="ob">Somente bloqueios</label></div></div>
  </div>
  <div class="mt-2"><a class="small" data-bs-toggle="collapse" href="#advanced" role="button"><i class="bi bi-sliders"></i> Mais filtros (N2)</a></div>
  <div class="collapse" id="advanced"><div class="row g-2 mt-1">
    <div class="col-md-2"><label class="form-label small">ADOM</label><select class="form-select form-select-sm" name="adom" id="adom"></select></div>
    <div class="col-md-3"><label class="form-label small">Equipamento (firewall)</label><select class="form-select form-select-sm" name="devices" id="devices"><option value="">Todos os firewalls</option></select></div>
    <div class="col-md-3"><label class="form-label small">Ação</label>
      <select class="form-select form-select-sm" name="action">
        <option value="">Qualquer</option><option value="accept">accept (permitido)</option><option value="deny">deny (negado)</option>
        <option value="blocked">blocked (filtro web)</option><option value="passthrough">passthrough (filtro web)</option>
        <option value="block">block (aplicação/DNS)</option><option value="pass">pass (aplicação/DNS)</option>
        <option value="dropped">dropped (IPS)</option><option value="close">close</option><option value="timeout">timeout</option>
      </select></div>
    <div class="col-md-1"><label class="form-label small">Limite</label><input type="number" class="form-control form-control-sm" name="limit" value="500" min="1" max="{{ max_results }}"></div>
    <div class="col-12"></div>
    <div class="col-md-3"><input class="form-control form-control-sm" name="dstip" placeholder="IP/rede de destino"></div>
    <div class="col-md-3"><input type="number" class="form-control form-control-sm" name="srcport" placeholder="Porta de origem" min="1" max="65535"></div>
    <div class="col-md-3"><input type="number" class="form-control form-control-sm" name="dstport" placeholder="Porta de destino" min="1" max="65535"></div>
    <div class="col-md-3"><input class="form-control form-control-sm" name="url" placeholder="URL (trecho)"></div>
    <div class="col-md-3"><input class="form-control form-control-sm" name="policy" placeholder="Regra (nº ou nome)"></div>
    <div class="col-md-3"><input class="form-control form-control-sm" name="profile" placeholder="Política / perfil de segurança"></div>
    <div class="col-md-3"><input class="form-control form-control-sm" name="srcintf" placeholder="Interface de entrada"></div>
    <div class="col-md-3"><input class="form-control form-control-sm" name="dstintf" placeholder="Interface de saída"></div>
  </div></div>
  <div class="mt-3 d-flex gap-2 align-items-center flex-wrap">
    <button class="btn btn-primary" id="btn"><span class="spinner-border spinner-border-sm spinner-overlay"></span> <i class="bi bi-search"></i> Pesquisar</button>
    <button type="reset" class="btn btn-outline-secondary">Limpar</button>
    <span id="summary" class="small text-body-secondary"></span>
    <span id="exports" class="ms-auto"></span>
  </div>
</form>
<div id="results"></div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("form"), btn = document.getElementById("btn");
  FLP.setDefaultPeriod(document.getElementById("start"), document.getElementById("end"), 1);
  FLP.loadAdomsAndDevices(document.getElementById("adom"), document.getElementById("devices"), "{{ default_adom }}");
  form.addEventListener("reset", () => setTimeout(() => FLP.setDefaultPeriod(document.getElementById("start"), document.getElementById("end"), 1)));
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    FLP.busy(btn, true);
    try {
      const r = await FLP.api("/api/faz/logs", { method: "POST", body: FLP.formData(form) });
      document.getElementById("summary").innerHTML = `${r.returned} de ${r.total} evento(s) carregado(s)${r.cache ? " · do cache" : ""}` +
        ` <span class="text-body-tertiary" title="Filtro enviado ao FortiAnalyzer">· <code>${FLP.esc(r.filter || "(sem filtro)")}</code></span>`;
      FLP.renderLogTable(document.getElementById("results"), r.rows);
      FLP.exportButtons(document.getElementById("exports"), r.result_id);
    } catch (e) { FLP.toast(e.message, "danger"); }
    finally { FLP.busy(btn, false); }
  });
});
</script>
{% endblock %}
