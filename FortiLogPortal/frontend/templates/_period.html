<div class="col-6 col-md-3">
  <label class="form-label small">Data inicial</label>
  <input type="datetime-local" class="form-control form-control-sm" name="start" id="start" required>
</div>
<div class="col-6 col-md-3">
  <label class="form-label small">Data final</label>
  <input type="datetime-local" class="form-control form-control-sm" name="end" id="end" required>
</div>
<div class="col-12 col-md-auto d-flex align-items-end gap-1 flex-wrap">
  <div class="btn-group btn-group-sm" role="group" aria-label="Períodos rápidos">
    <button type="button" class="btn btn-outline-secondary" data-hours="1">1h</button>
    <button type="button" class="btn btn-outline-secondary" data-hours="24">24h</button>
    <button type="button" class="btn btn-outline-secondary" data-hours="168">7 dias</button>
  </div>
</div>
