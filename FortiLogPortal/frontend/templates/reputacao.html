{% extends "base.html" %}
{% block title %}Reputação{% endblock %}
{% block heading %}<i class="bi bi-shield-check"></i> Reputação e IOC (Trend Vision One){% endblock %}
{% block content %}
<form id="form" class="card card-body mb-3">
  <div class="row g-2 align-items-end">
    <div class="col-md-6"><label class="form-label small">URL, domínio ou IP</label>
      <input class="form-control" name="indicator" placeholder="https://exemplo.com · google.com · 8.8.8.8" maxlength="2048"></div>
    <div class="col-md-2"><label class="form-label small">Tipo</label>
      <select class="form-select" name="type"><option value="auto">Detectar</option><option value="url">URL</option><option value="domain">Domínio</option><option value="ip">IP</option></select></div>
    <div class="col-md-2">
      <div class="form-check" title="{% if not sandbox_enabled %}Desabilitado: defina V1_SANDBOX_ENABLED=true em config\.env{% else %}Envia a URL para análise dinâmica (consome cota){% endif %}">
        <input class="form-check-input" type="checkbox" name="sandbox" id="sb" {% if not sandbox_enabled %}disabled{% endif %}>
        <label class="form-check-label small" for="sb">Analisar no Sandbox (URL ou domínio)</label></div>
      <div class="small text-body-tertiary" id="sbQuota"></div></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" id="btn"><span class="spinner-border spinner-border-sm spinner-overlay"></span> <i class="bi bi-search"></i> Consultar</button></div>
  </div>
  <div class="small text-body-secondary mt-2">Também aceita vários indicadores, um por linha, no campo abaixo.</div>
  <textarea class="form-control form-control-sm mt-1" id="bulk" rows="2" placeholder="google.com&#10;1.1.1.1"></textarea>
  <div class="mt-2 d-flex"><span id="exports" class="ms-auto"></span></div>
</form>
<div id="sandbox" class="mb-2"></div>
<div id="result"></div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("form"), btn = document.getElementById("btn");
  async function one(indicator, type, sandbox, target, sandbox_task) {
    const r = await FLP.api("/api/v1/reputation", { method: "POST", body: { indicator, type, sandbox, sandbox_task } });
    FLP.renderReputation(target, r);
    return r;
  }
  // Sandbox concluído: refaz a reputação já com o resultado no veredito. sb: resposta do envio (pode ser reaproveitado)
  const pollSandbox = (sb, indicator, type) => FLP.sandboxFlow(document.getElementById("sandbox"), indicator, type, sb.task_id, (rep) => {
    FLP.renderReputation(document.getElementById("result"), rep);
    FLP.exportButtons(document.getElementById("exports"), rep.result_id);
  }, {}, sb);
  {% if sandbox_enabled %}FLP.sandboxQuotaText().then((t) => { document.getElementById("sbQuota").textContent = t; });{% endif %}
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    FLP.busy(btn, true);
    const d = FLP.formData(form), res = document.getElementById("result");
    const bulk = document.getElementById("bulk").value.split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
    if (!bulk.length && !d.indicator) { FLP.toast("Informe um IP, domínio ou URL.", "warning"); FLP.busy(btn, false); return; }
    try {
      if (bulk.length) {
        res.innerHTML = "";
        for (const ind of bulk.slice(0, 20)) {
          const div = document.createElement("div"); res.appendChild(div);
          try { await one(ind, "auto", false, div); } catch (e) { div.innerHTML = `<div class="alert alert-danger small">${FLP.esc(ind)}: ${FLP.esc(e.message)}</div>`; }
        }
        document.getElementById("exports").innerHTML = "";
      } else {
        const r = await one(d.indicator, d.type, !!d.sandbox, res);
        FLP.exportButtons(document.getElementById("exports"), r.result_id);
        const sb = r.detalhes && r.detalhes.sandbox;
        if (sb && sb.task_id) pollSandbox(sb, r.indicador, r.tipo);
        else if (d.sandbox && r.erros?.sandbox) FLP.toast(`Sandbox: ${r.erros.sandbox}`, "warning");
      }
    } catch (e) { FLP.toast(e.message, "danger"); }
    finally { FLP.busy(btn, false); }
  });
  const pre = new URLSearchParams(location.search).get("q");  // vindo do detalhe de um log
  if (pre) { form.elements.indicator.value = pre; form.requestSubmit(); }
});
</script>
{% endblock %}
